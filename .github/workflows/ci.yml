name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check content and components
        run: npm run check

      - name: Build static site
        run: npm run build
